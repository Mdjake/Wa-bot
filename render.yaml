# Render blueprint — optional. You can also create the service in the dashboard.
services:
  - type: web
    name: wa-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # your WhatsApp login, base64 — see README "Deploy to Render"
      - key: SESSION_ID
        sync: false
      - key: OWNER_NUMBERS
        sync: false
      - key: BOT_NAME
        sync: false
      - key: BOT_MODE
        value: public
